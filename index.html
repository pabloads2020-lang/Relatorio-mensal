<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>PBF · Relatório Mensal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Atkinson+Hyperlegible:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg: #0e1117; --bg2: #161b25; --bg3: #1c2333;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --gold: #f5c842; --gold2: #e0a800;
  --text: #e8eaf0; --text2: #8b93a7; --text3: #555e72;
  --green: #2ecc71; --green-bg: rgba(46,204,113,0.12);
  --red: #e74c3c; --red-bg: rgba(231,76,60,0.12);
  --amber: #f39c12; --amber-bg: rgba(243,156,18,0.12);
  --blue: #3498db; --blue-bg: rgba(52,152,219,0.12);
  --header-bg: #161b25; --header-border: rgba(255,255,255,0.07);
  --card-bg: #161b25; --card-border: rgba(255,255,255,0.07);
  --debug-bg: #1c2333; --overlay-bg: rgba(14,17,23,.88);
  --footer-border: rgba(255,255,255,0.07);
  --relatorio-bg: linear-gradient(135deg, rgba(245,200,66,0.03) 0%, rgba(52,152,219,0.03) 100%);
}
body.light {
  --bg: #f5f7fa; --bg2: #ffffff; --bg3: #f0f2f5;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.12);
  --gold: #d4a017; --gold2: #b8860b;
  --text: #1a1a2e; --text2: #4a5568; --text3: #718096;
  --green: #27ae60; --green-bg: rgba(39,174,96,0.1);
  --red: #e74c3c; --red-bg: rgba(231,76,60,0.1);
  --amber: #e67e22; --amber-bg: rgba(230,126,34,0.1);
  --header-bg: #ffffff; --header-border: rgba(0,0,0,0.08);
  --card-bg: #ffffff; --card-border: rgba(0,0,0,0.08);
  --debug-bg: #f7fafc; --overlay-bg: rgba(255,255,255,.95);
  --footer-border: rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-top: 0; }

/* ==================== TOPBAR PADRÃO HUB FINANCEIRO ==================== */
.hub-topbar {
  --bg-topbar: #141720;
  --border-topbar: #2a2e3f;
  --text-topbar: #e1e3ef;
  --text2-topbar: #9a9eb8;
  --text3-topbar: #5c6080;
  --gold-topbar: #f5c842;
  --amber-topbar: #e0ac2c;
  font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-topbar);
  border-bottom: 1px solid var(--border-topbar);
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 200;
}
body.light .hub-topbar {
  --bg-topbar: #ffffff;
  --border-topbar: #d4d8e2;
  --text-topbar: #1a1d2e;
  --text2-topbar: #4a4f6a;
  --text3-topbar: #8a90a8;
  --gold-topbar: #b8860b;
  --amber-topbar: #c47d00;
}
.hub-topbar-left, .hub-topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.hub-topbar-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  pointer-events: none;
}
.hub-pbf-badge {
  background: var(--gold-topbar);
  padding: 0 12px;
  height: 30px;
  border-radius: 40px;
  display: flex;
  align-items: center;
  font-size: 12px;
  font-weight: 800;
  color: #000;
  letter-spacing: 0.5px;
}
.hub-topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-topbar);
  white-space: nowrap;
}
.hub-back-btn, .hub-newtab-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: transparent;
  border: 1px solid var(--border-topbar);
  border-radius: 8px;
  color: var(--text2-topbar);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 10px;
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
}
.hub-back-btn:hover, .hub-newtab-btn:hover {
  border-color: var(--amber-topbar);
  color: var(--gold-topbar);
  background: var(--bg-topbar);
}
.hub-back-btn .material-symbols-outlined,
.hub-newtab-btn .material-symbols-outlined {
  font-size: 16px;
}
.hub-active-tool {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold-topbar);
  white-space: nowrap;
  background: transparent;
}
.hub-clock {
  font-size: 11px;
  color: var(--text3-topbar);
  font-variant-numeric: tabular-nums;
  background: var(--bg-topbar);
  padding: 4px 10px;
  border-radius: 30px;
  border: 1px solid var(--border-topbar);
}
.hub-theme-btn {
  background: var(--bg-topbar);
  border: 1px solid var(--border-topbar);
  border-radius: 30px;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: border-color 0.2s;
  flex-shrink: 0;
}
.hub-theme-btn:hover {
  border-color: var(--gold-topbar);
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 20px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
@media (max-width: 600px) {
  .hub-back-btn span:not(.material-symbols-outlined),
  .hub-newtab-btn span:not(.material-symbols-outlined) {
    display: none;
  }
  .hub-back-btn, .hub-newtab-btn {
    padding: 5px 8px;
  }
  .hub-active-tool {
    font-size: 13px;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hub-clock {
    font-size: 10px;
    padding: 4px 6px;
  }
}
@media (max-width: 480px) {
  .hub-topbar-title {
    display: none;
  }
  .hub-topbar-center {
    position: static;
    transform: none;
    margin: 0 auto;
  }
}
/* ==================== FIM TOPBAR ==================== */

/* ESTILOS ORIGINAIS (AJUSTADOS) */
.main { max-width: 900px; margin: 0 auto; padding: 2rem; }
.card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
.card-title { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.upload-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.file-label { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 1.5px dashed var(--border2); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-size: 14px; color: var(--text2); flex: 1; min-width: 180px; }
.file-label:hover { border-color: var(--gold); color: var(--gold); }
#filePdf { display: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; white-space: nowrap; }
.btn-gold { background: var(--gold); color: #000; }
.btn-gold:hover { background: var(--gold2); transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text2); }
.btn-ghost:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.status { display: none; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 8px; font-size: 14px; margin-top: 0.75rem; }
.status.show { display: flex; }
.status-ok { background: var(--green-bg); color: var(--green); border: 1px solid rgba(46, 204, 113, 0.25); }
.status-err { background: var(--red-bg); color: var(--red); border: 1px solid rgba(231, 76, 60, 0.25); }
.patrim-tag { display: none; align-items: center; gap: 6px; margin-top: 0.6rem; background: rgba(245, 200, 66, 0.1); border: 1px solid rgba(245, 200, 66, 0.25); border-radius: 20px; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--gold); width: fit-content; }
.patrim-tag.show { display: flex; }
.btn-debug { background: transparent; border: 1px solid var(--border2); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 500; cursor: pointer; color: var(--text2); display: flex; align-items: center; gap: 6px; margin-top: 1rem; }
.btn-debug:hover { border-color: var(--gold); color: var(--gold); background: rgba(245,200,66,0.1); }
.debug-box { display: none; background: var(--debug-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; font-size: 12px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; margin-top: 0.5rem; font-family: monospace; }
.debug-box.show { display: block; }
.overlay { display: none; position: fixed; inset: 0; background: var(--overlay-bg); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
.overlay.show { display: flex; }
.spin { width: 40px; height: 40px; border: 3px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: rot 0.8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.footer { text-align: center; font-size: 12px; color: var(--text3); padding: 2rem; border-top: 1px solid var(--footer-border); margin-top: 1rem; }
.arrow { transition: transform 0.2s ease; display: inline-block; }
.arrow.rotated { transform: rotate(90deg); }
.relatorio-container { background: var(--relatorio-bg); border-radius: 12px; padding: 1.5rem; }
.relatorio-texto { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
.cenario-textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; resize: vertical; margin-top: 0.5rem; }
.cenario-textarea:focus { outline: none; border-color: var(--gold); }
</style>

<body>

<!-- ==================== TOPBAR PADRÃO HUB FINANCEIRO ==================== -->
<div class="hub-topbar">

<main class="main">

    <textarea id="textoCenario" class="cenario-textarea" rows="6">O mercado financeiro brasileiro em maio operou sob maior cautela, com o Ibovespa passando por uma realização de lucros após a estabilidade do mês anterior e o dólar voltando a registrar valorização diante das incertezas locais e globais. Na política monetária, o Banco Central manteve uma postura vigilante devido às expectativas desancoradas de inflação, o que reduziu o otimismo sobre a velocidade dos próximos cortes da taxa Selic; esse cenário de juros ainda elevados continuou mantendo os rendimentos de renda fixa em patamares muito atrativos para os investidores, porém, com marcação a mercado em títulos atrelados a inflação e também nos títulos prefixados.
No cenário internacional, o foco se dividiu entre os desdobramentos geopolíticos e os indicadores econômicos dos Estados Unidos, reforçando o debate de que os juros americanos devem permanecer altos por mais tempo (_"higher for longer"_). Apesar dessa pressão e da consequente volatilidade nas bolsas globais, os mercados externos demonstraram seletividade, com as principais praças mostrando resiliência e premiando empresas com balanços sólidos e forte geração de caixa.</textarea>

<footer class="footer">Material informativo — não constitui recomendação de investimento.</footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ========== TOPBAR FUNCTIONS ==========
document.getElementById('hubBackBtn')?.addEventListener('click', () => {
  if (window.self !== window.top) {
    window.parent.postMessage({ action: 'hubNavigate', target: 'home' }, '*');
  } else {
    window.location.href = "https://pabloads2020-lang.github.io/Dashboard-Ferramentas-Integradas/";
  }
});
document.getElementById('hubNewTabBtn')?.addEventListener('click', () => {
  window.open(window.location.href, '_blank');
});

function updateClock() {
  const clockEl = document.getElementById('hubClock');
  if(!clockEl) return;
  const now = new Date();
  const formatted = now.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }) + ' · ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  clockEl.textContent = formatted;
}
updateClock();
setInterval(updateClock, 1000);

// ========== THEME (integrado com hubThemeBtn) ==========
function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  const btnTheme = document.getElementById('hubThemeBtn');
  if (savedTheme === 'light') {
    document.body.classList.add('light');
    if(btnTheme) btnTheme.textContent = '☀️';
  } else {
    document.body.classList.remove('light');
    if(btnTheme) btnTheme.textContent = '🌙';
  }
  if(btnTheme) {
    btnTheme.addEventListener('click', () => {
      if (document.body.classList.contains('light')) {
        document.body.classList.remove('light');
        localStorage.setItem('theme', 'dark');
        btnTheme.textContent = '🌙';
      } else {
        document.body.classList.add('light');
        localStorage.setItem('theme', 'light');
        btnTheme.textContent = '☀️';
      }
    });
  }
}
initTheme();

// ========== FUNÇÕES ORIGINAIS ==========
let debugLines = [];
let dadosProcessados = null;

function fmtBRL(v) { return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits: 2}); }
function setStatus(msg, tipo) { 
  const el = document.getElementById('status'); 
  el.innerHTML = msg; 
  el.className = 'status show status-' + tipo; 
  setTimeout(() => el.classList.remove('show'), 4000); 
}
function dbg(txt) { debugLines.push(txt); document.getElementById('debugBox').textContent = debugLines.join('\n'); }
function clearDebug() { debugLines = []; document.getElementById('debugBox').textContent = ''; }

function superLimpeza(texto) {
    return texto.replace(/\s+/g, '');
}

async function extrairDadosPDF(file) {
  let ab = await file.arrayBuffer();
  let pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  
  let dados = {
    alocacoes: {},
    retornos: {},
    patrimonio: null,
    rentabilidadeMensal: null,
    pctCdi: null,
    mesReferencia: "",
    anoReferencia: ""
  };
  
  for (let p = 1; p <= Math.min(pdf.numPages, 6); p++) {
    let page = await pdf.getPage(p);
    let textContent = await page.getTextContent();
    let textoOriginal = textContent.items.map(item => item.str).join(' ');
    let textoLimpo = superLimpeza(textoOriginal);
    
    dbg(`\n--- PÁGINA ${p} (LIMPA) ---`);
    dbg(textoLimpo.substring(0, 1000));
    
    if (p === 1) {
      let dataMatch = textoLimpo.match(/DataDeReferência(\d{2})\/(\d{2})\/(\d{4})/);
      if (dataMatch) {
        let meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
        dados.mesReferencia = meses[parseInt(dataMatch[2]) - 1];
        dados.anoReferencia = dataMatch[3];
        dbg(`📅 Data: ${dados.mesReferencia}/${dados.anoReferencia}`);
      }
    }
    
    let patMatch = textoLimpo.match(/PATRIMÔNIOTOTALBRUTO:R\$([\d\.]+,\d{2})/i);
    if (patMatch) {
      dados.patrimonio = patMatch[1];
      dbg(`💰 Patrimônio: R$ ${dados.patrimonio}`);
    }
    
    let rentMatch = textoLimpo.match(/R\$[\d\.]+,\d{2}(-?[\d,]+)%(-?[\d,]+)%/i);
    if (rentMatch && !dados.rentabilidadeMensal) {
      dados.rentabilidadeMensal = rentMatch[1].replace(',', '.');
      dados.pctCdi = rentMatch[2].replace(',', '.');
      dbg(`📈 Rentabilidade Mensal: ${dados.rentabilidadeMensal}%`);
      dbg(`📊 %CDI: ${dados.pctCdi}%`);
    }
    
    let regexClasse = /([A-Za-zÀ-Úà-û]+?)\((\d+),(\d+)%\)R\$[\d\.]+,\d+(-?\d+),(\d+)%/gi;
    let match;
    while ((match = regexClasse.exec(textoLimpo)) !== null) {
      let nome = match[1];
      let alocacao = match[2] + ',' + match[3];
      let retorno = match[4] + ',' + match[5];
      
      if (nome === 'MPósFixado') nome = 'PósFixado';
      
      if (nome === 'PósFixado') nome = 'Pós-Fixado';
      else if (nome === 'PréFixado') nome = 'Pré-Fixado';
      else if (nome === 'Inflação') nome = 'Inflação';
      else if (nome === 'RendaVariávelBrasil') nome = 'Renda Variável Brasil';
      else if (nome === 'RendaVariávelGlobal') nome = 'Renda Variável Global';
      else if (nome === 'RendaFixaGlobal') nome = 'Renda Fixa Global';
      else if (nome === 'Alternativo') nome = 'Alternativo';
      else if (nome === 'Multimercado') nome = 'Multimercado';
      else if (nome === 'FundosListados') nome = 'Fundos Listados';
      else if (nome === 'Caixa') nome = 'Caixa';
      else if (nome === 'Proventos') nome = 'Proventos';
      
      if (alocacao && retorno && !dados.alocacoes[nome]) {
        dados.alocacoes[nome] = alocacao;
        dados.retornos[nome] = retorno;
        dbg(`✅ ${nome}: alocação ${alocacao}%, retorno ${retorno}%`);
      }
    }
  }
  
  return dados;
}

function gerarRelatorioTexto(dados) {
  let mes = dados.mesReferencia || "maio";
  let ano = dados.anoReferencia || "2026";
  let rentabilidade = dados.rentabilidadeMensal;
  let pctCdi = dados.pctCdi;
  let patrimonio = dados.patrimonio;
  let alocacoes = dados.alocacoes;
  let retornos = dados.retornos;
  
  let cenario = document.getElementById('textoCenario').value;
  
  let desempenhoTexto = "";
  let classesList = [];
  
  for (let nome in alocacoes) {
    if (alocacoes[nome]) {
      let alocNum = parseFloat(alocacoes[nome].replace(',', '.'));
      classesList.push({ nome: nome, alocacao: alocNum, alocStr: alocacoes[nome], retorno: retornos[nome] });
    }
  }
  classesList.sort((a, b) => b.alocacao - a.alocacao);
  
  for (let item of classesList) {
    let ret = item.retorno.replace(',', '.');
    let retNum = parseFloat(ret);
    let isNegativo = ret.startsWith('-') || retNum < 0;
    let movimento = isNegativo ? 'recuou' : 'subiu';
    let retornoAbs = isNegativo ? ret.replace('-', '') : ret;
    desempenhoTexto += `${item.nome} (${item.alocStr}% da carteira) ${movimento} ${retornoAbs}%; `;
  }
  
  if (desempenhoTexto === "") {
    desempenhoTexto = "Não foi possível capturar os retornos individuais das classes no PDF.";
  }
  
  let rentabilidadeStr = rentabilidade ? `${rentabilidade.replace(',', '.')}%` : "não disponível";
  let pctCdiStr = pctCdi ? `${pctCdi.replace(',', '.')}%` : "não disponível";
  let patrimonioStr = patrimonio ? fmtBRL(parseFloat(patrimonio.replace(/\./g, '').replace(',', '.'))) : "";
  
  let texto = `Prezado cliente, tudo bem? Segue o seu relatório mensal.

${cenario}

Considerando toda volatilidade do mês e a forte correção do mercado, sua carteira atravessou esse ambiente com resiliência, apresentando um retorno de ${rentabilidadeStr} no mês de ${mes.toLowerCase()} de ${ano}, equivalente a ${pctCdiStr} do CDI do período.${patrimonioStr ? ` O patrimônio atual é de ${patrimonioStr}.` : ''}
No desempenho por classe de ativo: ${desempenhoTexto}

Por fim, reforçamos a importância da disciplina na manutenção da estratégia e nos aportes focando no desenvolvimento da carteira no longo prazo. Essa postura é fundamental para atravessar diferentes ciclos de mercado, aproveitar oportunidades, reduzir os impactos das oscilações no curto prazo e manter a carteira alinhada aos seus objetivos financeiros.`;
  
  return texto;
}

// ========== EVENTOS ORIGINAIS ==========
document.getElementById('btnToggleDebug').addEventListener('click', () => {
  document.getElementById('debugBox').classList.toggle('show');
  document.getElementById('debugArrow').classList.toggle('rotated');
});

document.getElementById('filePdf').addEventListener('change', function() {
  document.getElementById('fileName').textContent = this.files[0]?.name || 'Selecionar arquivo PDF...';
});

document.getElementById('btnCopiar').addEventListener('click', async () => {
  const texto = document.getElementById('relatorioConteudo').innerText;
  try {
    await navigator.clipboard.writeText(texto);
    setStatus('✅ Texto copiado para a área de transferência!', 'ok');
  } catch (err) {
    setStatus('❌ Erro ao copiar texto', 'err');
  }
});

document.getElementById('btnImportar').addEventListener('click', async () => {
  let file = document.getElementById('filePdf').files[0];
  if (!file) { setStatus('Selecione um arquivo PDF primeiro.', 'err'); return; }
  clearDebug();
  document.getElementById('overlay').classList.add('show');
  try {
    let dados = await extrairDadosPDF(file);
    dadosProcessados = dados;
    let textoFinal = gerarRelatorioTexto(dados);
    document.getElementById('relatorioConteudo').innerHTML = `<div class="relatorio-texto">${textoFinal.replace(/\n/g, '<br>')}</div>`;
    setStatus('✅ PDF importado com sucesso! Relatório gerado.', 'ok');
    if (dados.patrimonio) {
      document.getElementById('patrimVal').innerHTML = fmtBRL(parseFloat(dados.patrimonio.replace(/\./g, '').replace(',', '.')));
      document.getElementById('patrimTag').classList.add('show');
    }
  } catch (e) {
    setStatus('Erro ao processar PDF: ' + e.message, 'err');
    dbg('ERRO: ' + e.message);
  } finally {
    document.getElementById('overlay').classList.remove('show');
  }
});

document.getElementById('btnLimpar').addEventListener('click', () => {
  dadosProcessados = null;
  document.getElementById('status').classList.remove('show');
  document.getElementById('patrimTag').classList.remove('show');
  document.getElementById('relatorioConteudo').innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--text3);">⚡ Importe um PDF para gerar o relatório automático</div>';
  clearDebug();
  document.getElementById('filePdf').value = '';
  document.getElementById('fileName').textContent = 'Selecionar arquivo PDF...';
});
</script>
</body>
</html>
